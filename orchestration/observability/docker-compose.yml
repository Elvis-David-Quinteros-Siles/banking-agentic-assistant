# Langfuse 4 self-hosted (trazas de LLM, costos, scores de los Evals), adaptado del compose oficial:
#   - solo local: la UI en 127.0.0.1:3100 y ningún otro puerto publicado (el oficial publica
#     PostgreSQL en 5432 y MinIO en 9090 hacia la red)
#   - telemetría de Langfuse apagada (on-premise: nada sale de la máquina)
#   - organización, proyecto, claves y usuario creados al arrancar (LANGFUSE_INIT_*)
#
#   docker compose -f orchestration/observability/docker-compose.yml up -d
#   UI: http://localhost:3100  ·  usuario admin@banco.local / langfuse-demo-123
#
# Las claves y contraseñas de abajo son de DEMO LOCAL. Para cualquier despliegue real se definen
# en un .env (ver la columna CHANGEME del compose oficial) o en un gestor de secretos.
x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: http://localhost:3100
  DATABASE_URL: postgresql://postgres:${LF_POSTGRES_PASSWORD:-langfuse-pg-demo}@postgres:5432/postgres
  SALT: ${LF_SALT:-banking-demo-salt}
  ENCRYPTION_KEY: ${LF_ENCRYPTION_KEY:-6c616e67667573652d62616e6b696e672d64656d6f2d6b65792d333262797465}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${LF_CLICKHOUSE_PASSWORD:-langfuse-ch-demo}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LF_MINIO_PASSWORD:-langfuse-minio-demo}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LF_MINIO_PASSWORD:-langfuse-minio-demo}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LF_REDIS_PASSWORD:-langfuse-redis-demo}

x-depends: &langfuse-depends
  postgres: { condition: service_healthy }
  minio: { condition: service_healthy }
  redis: { condition: service_healthy }
  clickhouse: { condition: service_healthy }

services:
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    container_name: bank-langfuse-worker
    restart: unless-stopped
    depends_on: *langfuse-depends
    environment: *langfuse-env

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    container_name: bank-langfuse
    restart: unless-stopped
    depends_on: *langfuse-depends
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LF_NEXTAUTH_SECRET:-banking-demo-nextauth-secret}
      LANGFUSE_INIT_ORG_ID: banco-demo
      LANGFUSE_INIT_ORG_NAME: Banco (demo)
      LANGFUSE_INIT_PROJECT_ID: asistente-bancario
      LANGFUSE_INIT_PROJECT_NAME: Asistente bancario
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-banking-demo
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LF_PROJECT_SECRET_KEY:-sk-lf-banking-demo-local}
      LANGFUSE_INIT_USER_EMAIL: admin@banco.local
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LF_ADMIN_PASSWORD:-langfuse-demo-123}

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    container_name: bank-langfuse-clickhouse
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LF_CLICKHOUSE_PASSWORD:-langfuse-ch-demo}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio
    container_name: bank-langfuse-minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LF_MINIO_PASSWORD:-langfuse-minio-demo}
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/redis:7
    container_name: bank-langfuse-redis
    restart: unless-stopped
    command: --requirepass ${LF_REDIS_PASSWORD:-langfuse-redis-demo} --maxmemory-policy noeviction
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  postgres:
    image: docker.io/postgres:17
    container_name: bank-langfuse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LF_POSTGRES_PASSWORD:-langfuse-pg-demo}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:
