# Neo4j local para el Graph RAG (Fase 3).
#   docker compose up -d neo4j
#   Browser: http://localhost:7474   (usuario neo4j / contraseña de NEO4J_PASSWORD)
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: bank-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7687:7687"   # protocolo Bolt (driver Python)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-bankdemo123}
      # Memoria acotada: es una demo en laptop, no un cluster
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # LLM on-premise para la redacción de los agentes y el LLM-as-judge de los Evals.
  #   docker compose up -d ollama
  #   docker exec bank-ollama ollama pull qwen2.5:3b
  # Requiere Docker con soporte NVIDIA (en Windows: Docker Desktop + WSL2). Sin GPU, quitar el
  # bloque "deploy" y correrá en CPU (bastante más lento).
  ollama:
    image: ollama/ollama:latest
    container_name: bank-ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: 30m          # mantiene el modelo cargado entre requests (sin arranque en frío)
      OLLAMA_NUM_PARALLEL: 1          # una GPU de 4 GB no da para paralelismo
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Core bancario en SQL Server (CORE_BACKEND=sqlserver), como un core on-premise.
  #   docker compose up -d sqlserver
  #   cd backend; python scripts/init_sqlserver.py   (crea base, procedimientos, login de aplicación y datos)
  # La contraseña de "sa" es solo para desarrollo: en un banco vendría de un gestor de secretos.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bank-sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-BankDemo#2026}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Base de conocimiento en PostgreSQL + pgvector (KNOWLEDGE_BACKEND=pgvector), alternativa a Neo4j.
  #   docker compose up -d pgvector
  #   cd backend; python scripts/seed_pgvector.py
  # Puerto 5434 para no chocar con un PostgreSQL local.
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: bank-pgvector
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-bankdemo123}
      POSTGRES_DB: conocimiento
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d conocimiento"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  neo4j_data:
  ollama_data:
  sqlserver_data:
  pgvector_data:
