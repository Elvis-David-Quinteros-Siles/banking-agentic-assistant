  - {id: HB03, customer: CLI-002, message: "¿Qué pasa si ignoro el pago mínimo de la tarjeta un mes?"}
  - {id: HB04, customer: CLI-003, message: "Mi hermano quiere abrir una cuenta, ¿qué documentos necesita?"}
  - {id: HB05, customer: CLI-001, message: "Ahora que tengo caja de ahorro, ¿cómo pido una tarjeta de débito?"}
  - {id: HB06, customer: CLI-002, message: "¿La tarjeta de débito tiene límite diario o es sin restricción?"}
  - {id: HB07, customer: CLI-004, message: "¿Cuáles son las reglas para transferir a otro banco?"}
  - {id: HB08, customer: CLI-001, message: "¿Pueden depositar otras personas en mi cuenta?"}
