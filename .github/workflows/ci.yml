name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      # Los tests de integración (Neo4j, SQL Server, pgvector) se saltan solos aquí; corren en sus jobs.
      # Cobertura mínima exigida: 80% (medida sin servicios externos, como en este job)
      - run: pytest backend -q --cov --cov-report=term --cov-fail-under=80

  quality:
    name: Calidad · ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt ruff mypy
      - name: Lint (estilo, bugs probables, seguridad)
        run: ruff check backend evals finetune
      - name: Formato
        run: ruff format --check backend evals finetune
      - name: Tipos
        run: mypy

  evals:
    name: Evals · rules + BM25 (sin LLM)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Evals de punta a punta (falla si una métrica baja del umbral)
        run: python evals/run_evals.py --check
      - name: Evals como tests
        run: pytest evals -q
      - name: Publicar reporte en el resumen del job
        if: always()
        run: cat evals/reports/rules_keyword_fake.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-rules-keyword
          path: evals/reports/

  graph-rag:
    name: Evals · Graph RAG con Neo4j
    runs-on: ubuntu-latest
    needs: backend
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/bankdemo123
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Caché del modelo de embeddings (~220 MB)
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-paraphrase-multilingual-MiniLM-L12-v2
      - name: Cargar el grafo de conocimiento
        working-directory: backend
        run: python scripts/seed_neo4j.py --reset
      - name: Tests de integración con Neo4j
        run: pytest backend -q -m neo4j
      - name: Evals con Graph RAG
        run: python evals/run_evals.py --knowledge neo4j --check
      - name: Publicar reporte en el resumen del job
        if: always()
        run: cat evals/reports/rules_neo4j_fake.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-rules-neo4j
          path: evals/reports/

  enterprise-stack:
    name: Evals · SQL Server + pgvector
    runs-on: ubuntu-latest
    needs: backend
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: BankDemo#2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'BankDemo#2026' -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bank
          POSTGRES_PASSWORD: bankdemo123
          POSTGRES_DB: conocimiento
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U bank -d conocimiento"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Caché del modelo de embeddings
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-paraphrase-multilingual-MiniLM-L12-v2
      - name: Inicializar SQL Server (procedimientos, login de aplicación, datos)
        working-directory: backend
        run: python scripts/init_sqlserver.py
      - name: Cargar pgvector
        working-directory: backend
        run: python scripts/seed_pgvector.py
      - name: Tests de integración (mínimo privilegio, retriever pgvector)
        run: pytest backend -q -m "sqlserver or pgvector"
      - name: Evals con SQL Server + pgvector
        run: python evals/run_evals.py --core sqlserver --knowledge pgvector --check
      - name: Publicar reporte en el resumen del job
        if: always()
        run: cat evals/reports/rules_pgvector_fake_sqlserver.md >> "$GITHUB_STEP_SUMMARY"

  demo-image:
    name: Demo pública · imagen Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t banking-agent-demo .
      - name: Levantar y verificar API + frontend en un solo puerto
        run: |
          docker run -d --name demo -p 7860:7860 banking-agent-demo
          for i in $(seq 1 30); do curl -sf localhost:7860/health && break; sleep 2; done
          curl -sf localhost:7860/ | grep -q "<title>Asistente Bancario</title>"
          curl -sf -X POST localhost:7860/api/chat -H "Content-Type: application/json" \
            -d '{"customer_id":"CLI-001","message":"¿Cuál es mi saldo?"}' | grep -q "12.450,30"
          echo "Imagen de demo OK"

  publish-demo:
    name: Demo pública · publicar imagen (GHCR)
    # Solo en main y solo si la imagen y los Evals pasaron: el servidor descarga lo que se publica aquí
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [demo-image, evals]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login en GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Construir y publicar (latest + sha)
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::7}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"
          echo "Publicada $IMAGE:${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend · tests y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
