name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      # Los tests de integración con Neo4j se saltan solos aquí; corren en el job graph-rag
      - run: pytest backend -q

  evals:
    name: Evals · rules + BM25 (sin LLM)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Evals de punta a punta (falla si una métrica baja del umbral)
        run: python evals/run_evals.py --check
      - name: Evals como tests
        run: pytest evals -q
      - name: Publicar reporte en el resumen del job
        if: always()
        run: cat evals/reports/rules_keyword_fake.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-rules-keyword
          path: evals/reports/

  graph-rag:
    name: Evals · Graph RAG con Neo4j
    runs-on: ubuntu-latest
    needs: backend
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/bankdemo123
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Caché del modelo de embeddings (~220 MB)
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-paraphrase-multilingual-MiniLM-L12-v2
      - name: Cargar el grafo de conocimiento
        working-directory: backend
        run: python scripts/seed_neo4j.py --reset
      - name: Tests de integración con Neo4j
        run: pytest backend -q -m neo4j
      - name: Evals con Graph RAG
        run: python evals/run_evals.py --knowledge neo4j --check
      - name: Publicar reporte en el resumen del job
        if: always()
        run: cat evals/reports/rules_neo4j_fake.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-rules-neo4j
          path: evals/reports/

  frontend:
    name: Frontend · tests y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
